
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f7fb">
<title>台美股估值雷達</title>

<style>
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #182230;
  --muted: #667085;
  --line: #e5eaf1;
  --blue: #2457d6;
  --blue-light: #edf3ff;
  --green: #14804a;
  --red: #c0392b;
  --orange: #b76b12;
  --shadow: 0 5px 20px rgba(20, 35, 65, .06);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size: 16px;
  line-height: 1.65;
}

button, input, select { font: inherit; }

button { cursor: pointer; }

.container {
  width: min(1180px, calc(100% - 36px));
  margin: 0 auto;
}

header {
  padding: 30px 0 20px;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

h1 {
  font-size: 28px;
  line-height: 1.3;
  margin: 0;
  letter-spacing: -.5px;
}

.subtitle {
  color: var(--muted);
  margin-top: 8px;
  font-size: 15px;
}

.update-text {
  color: var(--muted);
  font-size: 14px;
  text-align: right;
}

.tabs {
  display: flex;
  gap: 8px;
  margin: 18px 0;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}

.tab {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 12px 17px;
  font-weight: 700;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
}

.tab.active {
  color: var(--blue);
  border-bottom-color: var(--blue);
}

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 18px 0;
}

.search {
  flex: 1;
  min-width: 210px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  outline: none;
}

.search:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(36,87,214,.1);
}

select, .refresh-btn {
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  color: var(--text);
}

.refresh-btn {
  background: var(--blue);
  color: white;
  border-color: var(--blue);
  font-weight: 700;
}

.refresh-btn:hover { opacity: .9; }

.summary {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 14px;
  margin: 12px 0;
}

.warning {
  display: none;
  background: #fff7e8;
  border: 1px solid #f2d6a5;
  color: #8a5714;
  padding: 12px 15px;
  border-radius: 10px;
  margin: 14px 0;
  font-size: 14px;
}

.warning.show { display: block; }

.stock-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  margin: 18px 0 35px;
}

.stock-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 17px 18px;
  box-shadow: var(--shadow);
  min-width: 0;
  transition: transform .15s, box-shadow .15s;
}

.stock-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(20,35,65,.1);
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.stock-title {
  min-width: 0;
  cursor: pointer;
}

.stock-name {
  font-size: 19px;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.stock-ticker {
  color: var(--muted);
  font-size: 13px;
  margin-top: 2px;
}

.sector {
  color: var(--muted);
  font-size: 13px;
  margin-top: 5px;
}

.star {
  border: 0;
  background: transparent;
  color: #c1c8d3;
  font-size: 25px;
  line-height: 1;
  padding: 2px 4px;
  flex-shrink: 0;
}

.star.active { color: #e3a008; }

.price-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-top: 17px;
}

.price-label {
  color: var(--muted);
  font-size: 13px;
}

.price {
  font-size: 22px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.upside {
  font-size: 18px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.positive { color: var(--green); }
.negative { color: var(--red); }
.neutral { color: var(--muted); }

.metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 15px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
}

.metric-label {
  color: var(--muted);
  font-size: 12px;
}

.metric-value {
  font-size: 15px;
  font-weight: 700;
  margin-top: 3px;
  overflow-wrap: anywhere;
}

.card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
}

.method {
  color: var(--muted);
  font-size: 12px;
  overflow-wrap: anywhere;
}

.detail-btn {
  border: 1px solid #d7e2fa;
  background: var(--blue-light);
  color: var(--blue);
  padding: 7px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.status-warning {
  color: var(--orange);
  font-size: 12px;
  margin-top: 10px;
  background: #fff8eb;
  padding: 7px 9px;
  border-radius: 7px;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  color: var(--muted);
  background: white;
  border: 1px dashed var(--line);
  padding: 45px 20px;
  border-radius: 14px;
}

.loading {
  grid-column: 1 / -1;
  text-align: center;
  color: var(--muted);
  padding: 40px;
}

.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(15, 23, 42, .48);
  padding: 20px;
  overflow-y: auto;
}

.modal-backdrop.show {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.modal {
  width: min(650px, 100%);
  background: white;
  border-radius: 16px;
  padding: 22px;
  margin: auto;
  box-shadow: 0 15px 50px rgba(0,0,0,.2);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.modal-title {
  font-size: 23px;
  font-weight: 800;
}

.close-btn {
  border: 0;
  background: #f1f3f6;
  border-radius: 8px;
  padding: 5px 11px;
  font-size: 20px;
}

.detail-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 12px;
  margin-top: 20px;
}

.detail-item {
  background: #f7f9fc;
  border-radius: 10px;
  padding: 12px;
  min-width: 0;
}

.detail-label {
  font-size: 13px;
  color: var(--muted);
}

.detail-value {
  font-size: 17px;
  font-weight: 700;
  margin-top: 4px;
  overflow-wrap: anywhere;
}

.detail-section {
  margin-top: 20px;
}

.detail-section h3 {
  font-size: 16px;
  margin: 0 0 8px;
}

.detail-text {
  color: #475467;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

footer {
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  padding: 20px 0 35px;
}

@media (max-width: 720px) {
  .container { width: min(100% - 24px, 600px); }
  header { padding-top: 22px; }
  h1 { font-size: 24px; }
  .stock-list { grid-template-columns: 1fr; gap: 11px; }
  .stock-card { padding: 15px; }
  .stock-name { font-size: 18px; }
  .price { font-size: 21px; }
  .update-text { text-align: left; }
  .detail-grid { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 380px) {
  .detail-grid { grid-template-columns: 1fr; }
  .metrics { gap: 5px; }
  .metric-value { font-size: 14px; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="header-top">
    <div>
      <h1>📊 台美股估值雷達</h1>
      <div class="subtitle">
        台股 50＋美股 100｜中性估值｜個股追蹤清單
      </div>
    </div>
    <div class="update-text" id="updatedAt">資料載入中…</div>
  </div>

  <nav class="tabs">
    <button class="tab active" data-market="TW" id="tabTW">
      台股 50
    </button>
    <button class="tab" data-market="US" id="tabUS">
      美股 100
    </button>
    <button class="tab" data-market="WATCH" id="tabWATCH">
      ⭐ 追蹤中 <span id="watchCount">0</span>
    </button>
  </nav>
</header>

<div class="toolbar">
  <input
    class="search"
    id="searchInput"
    type="search"
    placeholder="搜尋股票名稱、代號或產業…"
    autocomplete="off"
  >

  <select id="sortSelect" aria-label="排序方式">
    <option value="upside">依預估上漲空間排序</option>
    <option value="confidence">依估值信心度排序</option>
    <option value="quality">依品質分數排序</option>
  </select>

  <button class="refresh-btn" id="refreshBtn">↻ 重新整理</button>
</div>

<div class="summary">
  <span id="resultCount">準備載入資料…</span>
  <span id="marketLabel">目前市場：台股</span>
</div>

<div class="warning" id="globalWarning"></div>

<main class="stock-list" id="stockList">
  <div class="loading">正在讀取估值資料…</div>
</main>

<footer>
  本網站資料僅供研究參考，不構成投資建議。估值結果不代表未來報酬保證。
</footer>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modalTitle">個股詳細資訊</div>
        <div class="stock-ticker" id="modalTicker"></div>
      </div>
      <button class="close-btn" id="closeModal" aria-label="關閉">×</button>
    </div>
    <div id="modalContent"></div>
  </section>
</div>

<script>
"use strict";

const API = {
  stocks: "/api/stocks?market=",
  stock: "/api/stock/"
};

const WATCH_KEY = "tw-us-valuation-radar-watchlist-v1";

let currentMarket = "TW";
let marketStocks = { TW: [], US: [] };
let watchlist = loadWatchlist();
let currentStocks = [];

const $ = id => document.getElementById(id);

function loadWatchlist() {
  try {
    const saved = JSON.parse(localStorage.getItem(WATCH_KEY) || "[]");
    return new Set(Array.isArray(saved) ? saved.map(String) : []);
  } catch {
    return new Set();
  }
}

function saveWatchlist() {
  localStorage.setItem(WATCH_KEY, JSON.stringify([...watchlist]));
  updateWatchCount();
}

function updateWatchCount() {
  $("watchCount").textContent = watchlist.size;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function numberValue(value) {
  if (value === null || value === undefined || value === "") return null;
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function formatNumber(value, digits = 2) {
  const n = numberValue(value);
  if (n === null) return "—";
  return n.toLocaleString("zh-TW", {
    minimumFractionDigits: 0,
    maximumFractionDigits: digits
  });
}

function formatPercent(value) {
  const n = numberValue(value);
  if (n === null) return "—";
  return `${n > 0 ? "+" : ""}${formatNumber(n)}%`;
}

function formatPrice(value, currency) {
  const n = numberValue(value);
  if (n === null) return "—";
  const symbol = currency === "USD" ? "US$" :
    currency === "TWD" ? "NT$" : "";
  return symbol + formatNumber(n, 2);
}

function getTicker(stock) {
  return String(stock.ticker || "");
}

function getStockKey(stock) {
  return getTicker(stock).toUpperCase();
}

function isWatched(stock) {
  return watchlist.has(getStockKey(stock));
}

function toggleWatch(stock) {
  const key = getStockKey(stock);
  if (watchlist.has(key)) {
    watchlist.delete(key);
  } else {
    watchlist.add(key);
  }
  saveWatchlist();
  renderStocks();
}

function getUpsideClass(value) {
  const n = numberValue(value);
  if (n === null) return "neutral";
  if (n > 0) return "positive";
  if (n < 0) return "negative";
  return "neutral";
}

function hasAnomaly(stock) {
  const notes = String(stock.notes || "");
  const status = String(stock.status || "");
  const text = `${notes} ${status}`.toLowerCase();

  const anomalyWords = [
    "anomaly", "異常", "警示", "偏差",
    "資料不足", "極端", "不可靠", "suppress"
  ];

  return anomalyWords.some(word => text.includes(word)) ||
    stock.fair_value === null ||
    stock.fair_value === undefined ||
    stock.universe_verified === false;
}

function getAnomalyText(stock) {
  if (stock.universe_verified === false) {
    return "股票資料尚未通過名單驗證，請留意。";
  }

  if (stock.fair_value === null || stock.fair_value === undefined) {
    return "目前估值資料不足或估值結果受到抑制，請審慎參考。";
  }

  return String(stock.notes || stock.status || "此股票有估值異常提醒，請審慎參考。");
}

function sortStocks(stocks) {
  const mode = $("sortSelect").value;
  const result = [...stocks];

  result.sort((a, b) => {
    const getValue = stock => {
      if (mode === "confidence") {
        return numberValue(stock.confidence) ?? -Infinity;
      }
      if (mode === "quality") {
        return numberValue(stock.quality_score) ?? -Infinity;
      }
      return numberValue(stock.upside_pct) ?? -Infinity;
    };

    return getValue(b) - getValue(a);
  });

  return result;
}

function filterStocks(stocks) {
  const keyword = $("searchInput").value.trim().toLowerCase();

  if (!keyword) return stocks;

  return stocks.filter(stock => {
    const text = [
      stock.ticker,
      stock.name,
      stock.sector,
      stock.display_name
    ].join(" ").toLowerCase();

    return text.includes(keyword);
  });
}

function renderStocks() {
  let stocks;

  if (currentMarket === "WATCH") {
    stocks = [...marketStocks.TW, ...marketStocks.US]
      .filter(stock => isWatched(stock));
  } else {
    stocks = marketStocks[currentMarket] || [];
  }

  stocks = filterStocks(stocks);
  stocks = sortStocks(stocks);
  currentStocks = stocks;

  $("resultCount").textContent = `顯示 ${stocks.length} 檔股票`;

  if (currentMarket === "TW") {
    $("marketLabel").textContent = "目前市場：台股";
  } else if (currentMarket === "US") {
    $("marketLabel").textContent = "目前市場：美股";
  } else {
    $("marketLabel").textContent = "目前清單：追蹤中";
  }

  const list = $("stockList");

  if (!stocks.length) {
    list.innerHTML = `
      <div class="empty">
        ${currentMarket === "WATCH"
          ? "目前沒有追蹤中的股票。<br>點選個股右上角的 ☆ 即可加入追蹤。"
          : "找不到符合條件的股票。"}
      </div>`;
    return;
  }

  list.innerHTML = stocks.map(stock => {
    const ticker = escapeHTML(getTicker(stock));
    const name = escapeHTML(stock.name || stock.display_name || ticker);
    const sector = escapeHTML(stock.sector || "未分類");
    const currency = stock.currency || "";
    const price = formatPrice(stock.price, currency);
    const fairValue = formatPrice(stock.fair_value, currency);
    const upside = formatPercent(stock.upside_pct);
    const upsideClass = getUpsideClass(stock.upside_pct);
    const confidence = formatNumber(stock.confidence);
    const quality = formatNumber(stock.quality_score);
    const watched = isWatched(stock);
    const anomaly = hasAnomaly(stock);

    return `
      <article class="stock-card">
        <div class="card-top">
          <div class="stock-title" onclick="openDetail('${encodeURIComponent(ticker)}')">
            <div class="stock-name">${name}</div>
            <div class="stock-ticker">${ticker}</div>
            <div class="sector">${sector}</div>
          </div>

          <button
            class="star ${watched ? "active" : ""}"
            onclick="toggleWatchByTicker('${encodeURIComponent(ticker)}')"
            title="${watched ? "取消追蹤" : "加入追蹤"}"
            aria-label="${watched ? "取消追蹤" : "加入追蹤"}"
          >${watched ? "★" : "☆"}</button>
        </div>

        <div class="price-row">
          <div>
            <div class="price-label">目前價格</div>
            <div class="price">${price}</div>
          </div>
          <div style="text-align:right">
            <div class="price-label">預估上漲空間</div>
            <div class="upside ${upsideClass}">${upside}</div>
          </div>
        </div>

        <div class="metrics">
          <div>
            <div class="metric-label">合理價值</div>
            <div class="metric-value">${fairValue}</div>
          </div>
          <div>
            <div class="metric-label">信心度</div>
            <div class="metric-value">${confidence}</div>
          </div>
          <div>
            <div class="metric-label">品質分數</div>
            <div class="metric-value">${quality}</div>
          </div>
        </div>

        ${anomaly ? `
          <div class="status-warning">
            ⚠️ ${escapeHTML(getAnomalyText(stock))}
          </div>` : ""}

        <div class="card-bottom">
          <span class="method">${escapeHTML(stock.valuation_method || "估值模型")}</span>
          <button class="detail-btn"
            onclick="openDetail('${encodeURIComponent(ticker)}')">
            查看詳情 →
          </button>
        </div>
      </article>`;
  }).join("");
}

function toggleWatchByTicker(encodedTicker) {
  const ticker = decodeURIComponent(encodedTicker);
  const stock = [...marketStocks.TW, ...marketStocks.US]
    .find(item => getTicker(item).toUpperCase() === ticker.toUpperCase());

  if (stock) toggleWatch(stock);
}

async function loadMarket(market) {
  const response = await fetch(API.stocks + encodeURIComponent(market), {
    cache: "no-store"
  });

  if (!response.ok) {
    throw new Error(`讀取${market}資料失敗（HTTP ${response.status}）`);
  }

  const data = await response.json();

  if (!Array.isArray(data.stocks)) {
    throw new Error("API 回傳的股票資料格式不正確");
  }

  marketStocks[market] = data.stocks;

  if (data.updated_at) {
    $("updatedAt").textContent = `資料更新時間：${data.updated_at}`;
  }

  if (data.warning) {
    $("globalWarning").textContent = `資料提醒：${data.warning}`;
    $("globalWarning").classList.add("show");
  }

  return data;
}

async function refreshData() {
  const button = $("refreshBtn");
  button.disabled = true;
  button.textContent = "載入中…";

  $("stockList").innerHTML =
    '<div class="loading">正在讀取最新估值資料…</div>';

  try {
    await Promise.all([
      loadMarket("TW"),
      loadMarket("US")
    ]);

    $("globalWarning").classList.remove("show");
    renderStocks();
  } catch (error) {
    console.error(error);
    $("stockList").innerHTML = `
      <div class="empty">
        <strong>資料載入失敗</strong><br>
        ${escapeHTML(error.message)}<br>
        請稍後重新整理，或確認後端 API 是否正常。
      </div>`;
  } finally {
    button.disabled = false;
    button.textContent = "↻ 重新整理";
  }
}

function switchMarket(market) {
  currentMarket = market;

  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.market === market);
  });

  $("searchInput").value = "";
  renderStocks();
}

function detailItem(label, value) {
  return `
    <div class="detail-item">
      <div class="detail-label">${escapeHTML(label)}</div>
      <div class="detail-value">${escapeHTML(value ?? "—")}</div>
    </div>`;
}

async function openDetail(encodedTicker) {
  const ticker = decodeURIComponent(encodedTicker);

  $("modalTitle").textContent = "個股詳細資訊";
  $("modalTicker").textContent = ticker;
  $("modalContent").innerHTML =
    '<div class="loading">正在讀取個股資料…</div>';
  $("modalBackdrop").classList.add("show");

  try {
    const response = await fetch(API.stock + encodeURIComponent(ticker), {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(`讀取個股資料失敗（HTTP ${response.status}）`);
    }

    const stock = await response.json();

    const name = stock.name || stock.display_name || stock.ticker;
    const currency = stock.currency || "";
    const anomaly = hasAnomaly(stock);

    $("modalTitle").textContent = name;
    $("modalTicker").textContent =
      `${stock.ticker || ticker}｜${stock.sector || "未分類"}`;

    $("modalContent").innerHTML = `
      <div class="detail-grid">
        ${detailItem("目前價格", formatPrice(stock.price, currency))}
        ${detailItem("合理價值", formatPrice(stock.fair_value, currency))}
        ${detailItem("預估上漲空間", formatPercent(stock.upside_pct))}
        ${detailItem("悲觀估值", formatPrice(stock.bear_value, currency))}
        ${detailItem("樂觀估值", formatPrice(stock.bull_value, currency))}
        ${detailItem("估值信心度", formatNumber(stock.confidence))}
        ${detailItem("品質分數", formatNumber(stock.quality_score))}
        ${detailItem("估值方法", stock.valuation_method || "—")}
      </div>

      ${anomaly ? `
        <div class="status-warning" style="margin-top:16px">
          ⚠️ ${escapeHTML(getAnomalyText(stock))}
        </div>` : ""}

      <div class="detail-section">
        <h3>資料來源</h3>
        <div class="detail-text">${escapeHTML(stock.source || "—")}</div>
      </div>

      <div class="detail-section">
        <h3>估值備註</h3>
        <div class="detail-text">${escapeHTML(stock.notes || "目前沒有額外備註。")}</div>
      </div>

      <div class="detail-section">
        <h3>股票名單驗證</h3>
        <div class="detail-text">${
          stock.universe_verified === false
            ? "尚未通過驗證"
            : stock.universe_verified === true
              ? "已通過驗證"
              : "未提供驗證資訊"
        }</div>
      </div>
    `;
  } catch (error) {
    $("modalContent").innerHTML = `
      <div class="empty">${escapeHTML(error.message)}</div>`;
  }
}

function closeDetail() {
  $("modalBackdrop").classList.remove("show");
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => switchMarket(tab.dataset.market));
});

$("searchInput").addEventListener("input", renderStocks);
$("sortSelect").addEventListener("change", renderStocks);
$("refreshBtn").addEventListener("click", refreshData);
$("closeModal").addEventListener("click", closeDetail);

$("modalBackdrop").addEventListener("click", event => {
  if (event.target === $("modalBackdrop")) closeDetail();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeDetail();
});

updateWatchCount();
refreshData();
</script>
</body>
</html>
