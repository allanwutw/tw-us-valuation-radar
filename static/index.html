<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>台美大型股超級估值雷達</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17243b;font:15px system-ui,-apple-system,"Noto Sans TC",sans-serif}header{background:#142b49;color:#fff;padding:22px 16px}.w{max-width:1050px;margin:auto;padding:16px}header .w{padding:0}h1{font-size:clamp(24px,5vw,34px);margin:10px 0}.sub{color:#d8e4f4}.tabs,.ctrl{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}button,input,select{font:inherit;padding:11px;border:1px solid #dce4ef;border-radius:10px;background:#fff;color:#17243b}button{cursor:pointer}.tabs .on{background:#142b49;color:#fff;border-color:#142b49}.ctrl input{flex:1;min-width:0}.grid{display:grid;gap:9px}.card{background:#fff;border:1px solid #e0e7f0;border-radius:13px;padding:13px}.stock-card{cursor:pointer}.stock-card:hover{border-color:#9db5d3}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.stock-title{display:flex;align-items:flex-start;gap:7px;min-width:0}.stock-title>div{min-width:0}.stock-name{overflow-wrap:anywhere}.price{white-space:nowrap;text-align:right}.muted{color:#718097;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:9px;border-top:1px solid #e8edf4;padding-top:9px}.metrics small{color:#718097;font-size:12px}.metrics b{overflow-wrap:anywhere}.up{color:#087f5b}.down{color:#c2413b}.star{border:0;background:transparent;padding:2px 7px 2px 0;font-size:22px;line-height:1;color:#a0a9b7}.star.active{color:#e5a000}.detail{margin-top:14px;line-height:1.65}.detail h2{margin-top:0}.detail-actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:10px 12px;background:#fff8e6;border:1px solid #f2dfaa;border-radius:10px;color:#72520b;margin:10px 0}.empty{padding:20px;text-align:center;color:#718097}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.ctrl{flex-wrap:wrap}.ctrl input{flex-basis:100%}.ctrl select{flex:1;min-width:0}.metrics{gap:5px}.metrics small{font-size:11px}.metrics b{font-size:14px}.top{gap:8px}.price{font-size:14px}}
</style></head>
<body>
<header><div class="w"><b>AI INVESTMENT RADAR</b><h1>台美大型股超級估值雷達</h1><div class="sub">Top 50 + Top 50｜中性估值｜追蹤清單</div></div></header>
<main class="w"><p class="muted">規則：資料不完整就不給合理價；估值假設、來源與時間應可追溯。估值結果僅供研究參考，不構成投資建議。</p>
<div class="tabs" role="tablist" aria-label="市場選擇"><button id="TW" class="on" type="button">台股 50</button><button id="US" type="button">美股 50</button><button id="WATCH" type="button">⭐ 追蹤中 <span id="watchCount">0</span></button></div>
<div class="ctrl"><input id="q" type="search" placeholder="輸入股票代號或名稱，例如 MU、2330" aria-label="搜尋股票"><select id="s" aria-label="排序方式"><option value="upside">潛在報酬</option><option value="confidence">估值信心</option><option value="quality">品質</option></select><button id="r" type="button">更新</button></div>
<div id="msg" class="muted" role="status">載入中…</div><div id="list" class="grid"></div><section id="d" class="card detail" hidden aria-live="polite"></section></main>
<script>
'use strict';
let M='TW',A=[];const $=id=>document.getElementById(id);const WATCH_KEY='tw-us-valuation-radar-watchlist-v1';
const money=(v,c)=>v==null||!Number.isFinite(Number(v))?'—':(c==='TWD'?'NT$':'US$')+Number(v).toLocaleString('en-US',{maximumFractionDigits:2});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getWatch(){try{let v=JSON.parse(localStorage.getItem(WATCH_KEY)||'[]');return new Set(Array.isArray(v)?v.map(String):[])}catch(e){return new Set()}}
function saveWatch(s){try{localStorage.setItem(WATCH_KEY,JSON.stringify([...s]));return true}catch(e){return false}}
function countWatch(){$('watchCount').textContent=getWatch().size}
function toggleWatch(t){let s=getWatch();s.has(t)?s.delete(t):s.add(t);let ok=saveWatch(s);countWatch();draw();if(!ok)alert('此瀏覽器無法儲存追蹤清單，重新整理後可能會消失。')}
async function fetchMarket(m){let r=await fetch('/api/stocks?market='+encodeURIComponent(m));if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function load(){ $('msg').textContent='載入資料中…';try{if(M==='WATCH'){let [tw,us]=await Promise.all([fetchMarket('TW'),fetchMarket('US')]);let map=new Map();[...(tw.stocks||[]),...(us.stocks||[])].forEach(x=>map.set(String(x.ticker),x));let s=getWatch();A=[...s].map(t=>map.get(t)).filter(Boolean);let missing=[...s].filter(t=>!map.has(t));$('msg').textContent='追蹤清單｜共 '+A.length+' 檔'+(missing.length?'；有 '+missing.length+' 檔不在目前清單資料中':'')+'。追蹤設定儲存在此瀏覽器。'}else{let j=await fetchMarket(M);A=j.stocks||[];$('msg').textContent=(j.warning?j.warning+' ':'')+'資料更新：'+(j.updated_at||'未知')}countWatch();draw()}catch(e){$('msg').textContent='資料服務載入失敗：'+e.message+'。請確認網站 API 正常後再按「更新」。';$('list').innerHTML='<div class="card empty">目前無法載入股票資料。</div>'}}
function draw(){let q=$('q').value.trim().toLowerCase(),sort=$('s').value,s=getWatch();let a=A.filter(x=>(String(x.ticker||'')+' '+String(x.name||'')).toLowerCase().includes(q));a.sort((x,y)=>sort==='confidence'?(Number(y.confidence)||0)-(Number(x.confidence)||0):sort==='quality'?(Number(y.quality_score)||0)-(Number(x.quality_score)||0):Number(y.upside_pct??-999)-Number(x.upside_pct??-999));if(!a.length){$('list').innerHTML='<div class="card empty">'+(M==='WATCH'?'目前沒有符合條件的追蹤股票。可在台股或美股頁面按 ☆ 加入。':'沒有符合搜尋條件的股票。')+'</div>';return}
$('list').innerHTML=a.map(x=>{let t=String(x.ticker||''),safe=esc(t),watched=s.has(t),up=Number(x.upside_pct),upText=x.upside_pct==null||!Number.isFinite(up)?'待估值':(up>=0?'+':'')+up.toFixed(1)+'%',warning=(x.upside_pct!=null&&up>100)||(x.price>0&&x.fair_value>3*x.price)||(x.price>0&&x.bvps>20*x.price);return `<article class="card stock-card" tabindex="0" role="button" aria-label="查看 ${esc(x.name)} 詳情" onclick="show('${safe}')"><div class="top"><div class="stock-title"><button type="button" class="star ${watched?'active':''}" aria-label="${watched?'取消追蹤':'加入追蹤'} ${safe}" title="${watched?'取消追蹤':'加入追蹤'}" onclick="event.stopPropagation();toggleWatch('${safe}')">${watched?'★':'☆'}</button><div><b class="stock-name">${esc(x.name||t)}</b> <span class="muted">${safe}</span><div class="muted">${esc(x.sector||'待分類')}｜市值排名${x.universe_verified?'已驗證':'待驗證'}</div></div></div><b class="price">${money(x.price,x.currency)}</b></div>${warning?'<div class="notice">估值數字偏高，建議核對 EPS、股數、帳面價值與幣別後再參考。</div>':''}<div class="metrics"><div><small>中性合理價</small><br><b>${money(x.fair_value,x.currency)}</b></div><div><small>潛在報酬</small><br><b class="${Number.isFinite(up)&&up>=0?'up':'down'}">${upText}</b></div><div><small>信心</small><br><b>${x.confidence==null?'—':esc(x.confidence)}/100</b></div></div></article>`}).join('')}
async function show(t){let ticker=String(t);$('d').hidden=false;$('d').innerHTML='<p>載入個股資料中…</p>';$('d').scrollIntoView({behavior:'smooth',block:'start'});try{let r=await fetch('/api/stock/'+encodeURIComponent(ticker));if(!r.ok)throw Error('HTTP '+r.status);let x=await r.json(),watched=getWatch().has(ticker);$('d').innerHTML=`<h2>${esc(x.name||ticker)}（${esc(x.ticker||ticker)}）</h2><p>現價 <b>${money(x.price,x.currency)}</b>　中性合理價 <b>${money(x.fair_value,x.currency)}</b></p><p>悲觀 ${money(x.bear_value,x.currency)}｜中性 ${money(x.fair_value,x.currency)}｜樂觀 ${money(x.bull_value,x.currency)}</p><p>品質 ${x.quality_score??'—'}｜信心 ${x.confidence??'—'}/100｜模型：${esc(x.valuation_method||'多模型加權')}</p><p class="muted">資料來源：${esc(x.source||'未提供')}<br>資料日期：${esc(x.price_as_of||'未提供')}<br>${esc(x.notes||'')}</p><div class="detail-actions"><button type="button" id="detailWatch">${watched?'★ 已追蹤（點此取消）':'☆ 加入追蹤'}</button><button type="button" id="closeDetail">收起詳情</button></div>`;$('detailWatch').onclick=()=>{toggleWatch(ticker);$('detailWatch').textContent=getWatch().has(ticker)?'★ 已追蹤（點此取消）':'☆ 加入追蹤'};$('closeDetail').onclick=()=>$('d').hidden=true}catch(e){$('d').innerHTML='<p>無法取得個股詳情：'+esc(e.message)+'</p><button type="button" id="closeDetail">收起詳情</button>';$('closeDetail').onclick=()=>$('d').hidden=true}}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{M=b.id;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.id===M));$('d').hidden=true;load()}));$('q').addEventListener('input',draw);$('s').addEventListener('change',draw);$('r').addEventListener('click',load);countWatch();load();
</script></body></html>
