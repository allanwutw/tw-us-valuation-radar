<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台美大型股超級估值雷達</title><style>
body{margin:0;background:#f4f7fb;color:#17243b;font:15px system-ui,-apple-system,"Noto Sans TC",sans-serif}.w{max-width:1050px;margin:auto;padding:16px}header{background:#142b49;color:#fff;padding:22px}.tabs, .ctrl{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}.on{background:#142b49;color:#fff}button,input,select{padding:11px;border:1px solid #dce4ef;border-radius:10px;background:#fff}.ctrl input{flex:1}.grid{display:grid;gap:9px}.card{background:#fff;border:1px solid #e0e7f0;border-radius:13px;padding:13px}.top{display:flex;justify-content:space-between}.muted{color:#718097;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px;border-top:1px solid #e8edf4;padding-top:9px}.up{color:#087f5b}.down{color:#c2413b}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}</style>
<header><div class=w><b>AI INVESTMENT RADAR</b><h1>台美大型股超級估值雷達</h1><div>Top 50 + Top 50｜中性估值｜任意股票擴充入口</div></div></header><main class=w>
<p class=muted>規則：資料不完整就不給合理價；估值假設、來源與時間必須可追溯。</p><div class=tabs><button id=TW class=on>台股 50</button><button id=US>美股 50</button></div>
<div class=ctrl><input id=q placeholder="輸入股票代號搜尋，例如 MU、2330"><select id=s><option value=upside>潛在報酬</option><option value=confidence>估值信心</option><option value=quality>品質</option></select><button id=r>更新</button></div>
<div id=msg class=muted>載入中…</div><div id=list class=grid></div><div id=d class=card hidden></div></main>
<script>
let M='TW',A=[],$=x=>document.getElementById(x);
const money=(v,c)=>v==null?'—':(c==='TWD'?'NT$':'US$')+Number(v).toLocaleString('en-US',{maximumFractionDigits:2});
async function load(){try{let z=await fetch('/api/stocks?market='+M);let j=await z.json();A=j.stocks||[];$('msg').textContent=(j.warning||'')+' 資料更新：'+(j.updated_at||'未知');draw()}catch(e){$('msg').textContent='資料服務尚未啟動：'+e.message}}
function draw(){let q=$('q').value.toLowerCase(),a=A.filter(x=>(x.ticker+' '+x.name).toLowerCase().includes(q)),s=$('s').value;
a.sort((x,y)=>s==='confidence'?(y.confidence||0)-(x.confidence||0):s==='quality'?(y.quality_score||0)-(x.quality_score||0):(y.upside_pct??-999)-(x.upside_pct??-999));
$('list').innerHTML=a.map(x=>`<article class=card onclick="show('${x.ticker}')"><div class=top><div><b>${x.name}</b> <span class=muted>${x.ticker}</span><div class=muted>${x.sector||'待分類'}｜市值排名${x.universe_verified?'已驗證':'待驗證'}</div></div><b>${money(x.price,x.currency)}</b></div><div class=metrics><div><small>中性合理價</small><br><b>${money(x.fair_value,x.currency)}</b></div><div><small>潛在報酬</small><br><b class=${(x.upside_pct??-1)>=0?'up':'down'}>${x.upside_pct==null?'待估值':(x.upside_pct>=0?'+':'')+x.upside_pct.toFixed(1)+'%'}</b></div><div><small>信心</small><br><b>${x.confidence||'—'}/100</b></div></div></article>`).join('')||'<div class=card>沒有資料。</div>'}
async function show(t){let z=await fetch('/api/stock/'+encodeURIComponent(t));let x=await z.json();$('d').hidden=false;$('d').innerHTML=`<h2>${x.name}（${x.ticker}）</h2><p>現價 ${money(x.price,x.currency)}　中性 ${money(x.fair_value,x.currency)}</p><p>悲觀 ${money(x.bear_value,x.currency)}｜中性 ${money(x.fair_value,x.currency)}｜樂觀 ${money(x.bull_value,x.currency)}</p><p>品質 ${x.quality_score??'—'}｜信心 ${x.confidence}/100｜模型：${x.valuation_method||'多模型加權'}</p><p class=muted>${x.source||''}<br>${x.notes||''}</p>`;$('d').scrollIntoView({behavior:'smooth'})}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{M=b.id;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');load()});$('q').oninput=draw;$('s').onchange=draw;$('r').onclick=load;load();
</script></html>
